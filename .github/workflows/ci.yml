name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      SUPPORT_GITHUB_TOKEN: ${{ secrets.SUPPORT_GITHUB_TOKEN }}
      GITHUB_TEST_ISSUE_REPO: ${{ secrets.GITHUB_TEST_ISSUE_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate MCP config
        run: uv run python generate_mcp_config.py

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Pre-trust workspace for Claude Code
        run: |
          cat > ~/.claude.json <<EOF
          {"projects": {"$GITHUB_WORKSPACE": {"hasTrustDialogAccepted": true}}}
          EOF

      - name: Run E2E tests
        run: uv run pytest tests/ --junitxml=report.xml -v

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: report.xml
